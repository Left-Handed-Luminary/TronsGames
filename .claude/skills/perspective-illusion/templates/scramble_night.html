<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scramble Night</title>
<!--
  Perspective-illusion template: a big scramble crossing at night in the rain.
  Night extras on top of street.html: glowing faces (windows, signs, screens, rain),
  glow bleed, wet-road reflections, a walking crowd, slide-cut ad screens, grade.
  Contract: #frame, window.READY, window.LOOP_MS, render(ms), probe(ms), setJitter(x,y),
  renderMany([[ms,jx,jy],...]), ?scale=.5.  See ../SKILL.md and ../reference.md.

  Sections:
    // ---------- setup        renderer, render targets, palette
    // ---------- kit          materials (with glow masks), textures, geometry helpers
    // ---------- scene        the crossing                                <- replace for a new scene
    // ---------- life         crowd, rain, screens (pure functions of ms)
    // ---------- cameras      shot list and timeline
    // ---------- post         passes, ink / two-tone / glow / reflections / sky shader
    // ---------- hooks        page contract
-->
<style>
  html, body { margin: 0; background: #0b0d16; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="frame"></canvas>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import {
  makeTimeline, drift, cameraFromShot, projectionMatrix, jitterToNdc, projectPoint,
} from './lib/camera.js';

// ---------- setup
const params = new URLSearchParams(location.search);
const SCALE = parseFloat(params.get('scale') || '1');
const WIDTH = Math.round(1920 * SCALE);
const HEIGHT = Math.round(1080 * SCALE);
const ASPECT = WIDTH / HEIGHT;
const LOOP_S = 14;
window.LOOP_MS = LOOP_S * 1000;

const canvas = document.getElementById('frame');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(WIDTH, HEIGHT, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const makeRT = (w = WIDTH, h = HEIGHT) => new THREE.WebGLRenderTarget(w, h, {
  type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true,
});
const rtAlb = makeRT();   // flat colour
const rtNrm = makeRT();   // view normal + linear depth (a = 0: sky)
const rtLit = makeRT();   // g: moon Lambert x shadow; r - g: glow flag
const rtPost = makeRT();  // composed sub-render; alpha = glow amount (bloom source)
const rtAcc = makeRT();   // average of sub-renders
const QW = Math.max(1, Math.round(WIDTH / 4)); const QH = Math.max(1, Math.round(HEIGHT / 4));
const rtQ1 = makeRT(QW, QH); const rtQ2 = makeRT(QW, QH);   // bloom ping-pong

function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Night palette: muted body colours (the moon and shade tints darken them in post) + neon accents. */
const P = {
  ink: '#121320', road: '#3c414d', roadDark: '#343843', walk: '#8d8a86', kerb: '#b9b4aa',
  wallA: '#a9a6b5', wallB: '#8f8ca0', wallC: '#7e95a1', wallD: '#b6aba0', wallE: '#6f6c80',
  roof: '#5e606b', glassDark: '#26324a', frame: '#2a2f3c', metal: '#6d7380', pole: '#7d7f86',
  warm: '#ffcf8a', neonPink: '#ff4f9a', neonCyan: '#3fe0ff', neonYellow: '#ffd23f', neonRed: '#ff4b3a',
  neonGreen: '#53f29a', white: '#eeeaf2', red: '#c2392f', dark: '#22242c', umbrella: '#e0413a',
};
const pick = (r, list) => list[Math.floor(r() * list.length)];

// ---------- kit
const scene = new THREE.Scene();
const world = new THREE.Group();   // static: merged by material at load
const live = new THREE.Group();    // moving / instanced: never merged
scene.add(world, live);

const matCache = new Map();
/** Flat-colour material. glow: 0 none, 1 the whole surface glows. */
function mat(color, glow = 0) {
  const key = `${color}|${glow}`;
  if (!matCache.has(key)) {
    const m = new THREE.MeshBasicMaterial({ color });
    m.shadowSide = THREE.DoubleSide;
    m.userData.glow = glow;
    matCache.set(key, m);
  }
  return matCache.get(key);
}
function canvasTex(w, h, paint, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  return tex;
}
/**
 * Textured material. If `glowPaint` is given it paints a second canvas (white = glows)
 * in the same layout: lit windows, sign faces, shop glass. Cached by key.
 */
function tmat(key, w, h, paint, { repeat = false, glowPaint = null, glowAll = false } = {}) {
  if (matCache.has(key)) return matCache.get(key);
  const tex = canvasTex(w, h, paint);
  const m = new THREE.MeshBasicMaterial({ map: tex });
  m.shadowSide = THREE.DoubleSide;
  m.userData.glow = glowAll ? 1 : 0;
  if (glowPaint) {
    const mask = canvasTex(w, h, (ctx) => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); glowPaint(ctx, w, h); }, false);
    m.userData.glowMap = mask;
    if (repeat) { mask.wrapS = mask.wrapT = THREE.RepeatWrapping; }
  }
  if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
  matCache.set(key, m);
  return m;
}

function add(g, geo, m, x, y, z, ry = 0) {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.rotation.y = ry;
  mesh.castShadow = mesh.receiveShadow = true;
  g.add(mesh);
  return mesh;
}
const box = (g, w, h, d, x, y, z, m, ry = 0) => add(g, new THREE.BoxGeometry(w, h, d), m, x, y + h / 2, z, ry);
const cyl = (g, rt, rb, h, x, y, z, m, seg = 14) => add(g, new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y + h / 2, z);
function scaleUV(geo, ru, rv) {
  if (ru === 1 && rv === 1) return geo;
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * ru, uv.getY(i) * rv);
  return geo;
}
function vquad(g, w, h, x, y, z, a, m, ru = 1, rv = 1) {
  return add(g, scaleUV(new THREE.PlaneGeometry(w, h), ru, rv), m, x, y, z, a);
}
function hquad(g, w, d, x, y, z, m, ru = 1, rv = 1) {
  const geo = new THREE.PlaneGeometry(w, d); geo.rotateX(-Math.PI / 2);
  return add(g, scaleUV(geo, ru, rv), m, x, y, z);
}
function bar(g, a, b, t, m) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(t, t, len), m);
  mesh.position.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2);
  mesh.lookAt(b[0], b[1], b[2]);
  mesh.castShadow = mesh.receiveShadow = true;
  g.add(mesh);
  return mesh;
}
function wire(g, a, b, sag, m, t = 0.035) {
  const n = 6; let prev = a;
  for (let i = 1; i <= n; i++) {
    const f = i / n;
    const p = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f - sag * 4 * f * (1 - f), a[2] + (b[2] - a[2]) * f];
    bar(g, prev, p, t, m); prev = p;
  }
}
function facade(cx, cz, a) {
  const t = [Math.cos(a), -Math.sin(a)]; const n = [Math.sin(a), Math.cos(a)];
  return { a, at: (u, o) => [cx + t[0] * u + n[0] * o, cz + t[1] * u + n[1] * o] };
}

// --- painters -----------------------------------------------------------------
const FONT_JP = '"IPAGothic","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif';
const FONT = '"Inter","Liberation Sans","Helvetica",sans-serif';

/** Window tile: 4 bays x 1 storey. `lit` decides per window; the same rng drives both canvases. */
function windowTile(wall, seed) {
  const layout = [];
  const r = rng(seed);
  for (let i = 0; i < 4; i++) layout.push({ lit: r() < 0.42, curtain: r(), side: r() < 0.5, warm: pick(r, [P.warm, '#fff0c8', '#ffe2b0', '#d8ecff']) });
  const rect = (w, h, i) => { const bw = w / 4; return [i * bw + bw * 0.16, h * 0.18, bw * 0.68, h * 0.56]; };
  return {
    paint(ctx, w, h) {
      ctx.fillStyle = wall; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, h - 6, w, 6);
      layout.forEach((L, i) => {
        const [x, y, ww, wh] = rect(w, h, i);
        ctx.fillStyle = P.frame; ctx.fillRect(x - 4, y - 4, ww + 8, wh + 8);
        ctx.fillStyle = L.lit ? L.warm : P.glassDark; ctx.fillRect(x, y, ww, wh);
        if (L.curtain < 0.6) {
          ctx.fillStyle = L.lit ? 'rgba(160,90,40,0.35)' : 'rgba(255,255,255,0.08)';
          const cw = ww * 0.35; ctx.fillRect(L.side ? x : x + ww - cw, y, cw, wh);
        }
        ctx.fillStyle = P.frame; ctx.fillRect(x + ww / 2 - 2, y, 4, wh);
        ctx.fillStyle = '#c9c4bb'; ctx.fillRect(x - 8, y + wh + 4, ww + 16, 6);
      });
    },
    glow(ctx, w, h) {
      layout.forEach((L, i) => {
        if (!L.lit) return;
        const [x, y, ww, wh] = rect(w, h, i);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, ww, wh);
        ctx.fillStyle = '#000'; ctx.fillRect(x + ww / 2 - 2, y, 4, wh);
      });
    },
  };
}
function paintSideWall(wall) {
  return (ctx, w, h) => {
    ctx.fillStyle = wall; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, h - 5, w, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let x = 0; x < w; x += w / 6) ctx.fillRect(x, 0, 2, h);
    ctx.fillStyle = '#5a5f6a'; ctx.fillRect(w * 0.08, 0, 6, h);
  };
}
/** Shopfront: glowing glass and signboard band. */
function shopfront(name, accent, seed) {
  const r = rng(seed);
  const panes = [];
  for (let i = 0; i < 6; i++) panes.push({ goods: [r(), r(), r()], poster: r() < 0.5 });
  return {
    paint(ctx, w, h) {
      ctx.fillStyle = P.wallE; ctx.fillRect(0, 0, w, h);
      const band = h * 0.18;
      ctx.fillStyle = accent; ctx.fillRect(0, 0, w, band);
      ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.round(band * 0.68)}px ${FONT_JP}`;
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(name, w / 2, band * 0.55);
      const top = h * 0.27; const bot = h * 0.97;
      ctx.fillStyle = P.frame; ctx.fillRect(w * 0.03, top, w * 0.94, bot - top);
      const n = Math.max(2, Math.min(6, Math.round(w / 90)));
      const pw = (w * 0.94 - (n + 1) * 5) / n;
      for (let i = 0; i < n; i++) {
        const x = w * 0.03 + 5 + i * (pw + 5);
        const g = ctx.createLinearGradient(x, top, x, bot);
        g.addColorStop(0, '#fff3dc'); g.addColorStop(1, '#ffd79a');
        ctx.fillStyle = g; ctx.fillRect(x, top + 5, pw, bot - top - 10);
        panes[i % 6].goods.forEach((v, k) => {
          ctx.fillStyle = ['#d64f3c', '#3a6fb0', '#2f8a5a', '#e2a02a'][Math.floor(v * 4)];
          ctx.fillRect(x + 6 + k * pw / 3.2, bot - 30 - v * 16, pw / 5, 16 + v * 10);
        });
        ctx.fillStyle = 'rgba(40,30,30,0.55)';                       // people inside
        ctx.fillRect(x + pw * 0.62, top + (bot - top) * 0.35, pw * 0.1, (bot - top) * 0.55);
        if (panes[i % 6].poster) {
          ctx.fillStyle = accent; ctx.fillRect(x + pw * 0.15, top + 12, pw * 0.36, (bot - top) * 0.3);
          ctx.fillStyle = '#fff'; ctx.font = `bold 13px ${FONT_JP}`; ctx.fillText('営業中', x + pw * 0.33, top + 30);
        }
      }
    },
    glow(ctx, w, h) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h * 0.18);
      ctx.fillStyle = '#b0b0b0'; ctx.fillRect(w * 0.03, h * 0.27, w * 0.94, h * 0.70);
    },
  };
}
function paintVertSign(text, bg, fg) {
  return (ctx, w, h) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = fg; ctx.lineWidth = 4; ctx.strokeRect(5, 5, w - 10, h - 10);
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const chars = [...text];
    const size = Math.min(w * 0.7, (h - 20) / chars.length * 0.9);
    ctx.font = `bold ${Math.round(size)}px ${FONT_JP}`;
    chars.forEach((c, i) => ctx.fillText(c, w / 2, 14 + (i + 0.5) * (h - 28) / chars.length));
  };
}
/** Ad slides (made-up brands). Each is painted once; the screen swaps maps on hard cuts. */
const SLIDES = [
  (ctx, w, h) => { const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#2b0f5c'); g.addColorStop(1, '#ff4f9a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#fff'; ctx.font = `bold ${h * 0.24}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.fillText('NEON TEA', w / 2, h * 0.5); ctx.font = `${h * 0.1}px ${FONT_JP}`; ctx.fillText('夜にとけるジャスミン', w / 2, h * 0.75);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(w * 0.85, h * 0.25, h * 0.12, 0, 7); ctx.fill(); },
  (ctx, w, h) => { ctx.fillStyle = '#04121c'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#3fe0ff';
    for (let i = 0; i < 9; i++) ctx.fillRect(w * 0.08 + i * w * 0.05, h * (0.75 - 0.05 * i), w * 0.03, h * (0.05 * i + 0.1));
    ctx.fillStyle = '#fff'; ctx.font = `bold ${h * 0.2}px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('KUMO 9', w * 0.58, h * 0.48);
    ctx.font = `${h * 0.09}px ${FONT}`; ctx.fillText('the cloud phone', w * 0.58, h * 0.66); },
  (ctx, w, h) => { ctx.fillStyle = '#ffd23f'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#121320';
    ctx.font = `bold ${h * 0.2}px ${FONT_JP}`; ctx.textAlign = 'center'; ctx.fillText('スターライト', w / 2, h * 0.42);
    ctx.font = `bold ${h * 0.13}px ${FONT}`; ctx.fillText('LIVE  12.24', w / 2, h * 0.7);
    ctx.fillStyle = '#ff4b3a'; ctx.fillRect(0, h * 0.86, w, h * 0.06); },
  (ctx, w, h) => { const g = ctx.createRadialGradient(w * 0.3, h * 0.5, 4, w * 0.3, h * 0.5, w * 0.6); g.addColorStop(0, '#53f29a'); g.addColorStop(1, '#06281a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#fff'; ctx.font = `bold ${h * 0.17}px ${FONT}`;
    ctx.textAlign = 'right'; ctx.fillText('MIDORI', w * 0.92, h * 0.45); ctx.font = `${h * 0.1}px ${FONT_JP}`; ctx.fillText('新しい朝の炭酸', w * 0.92, h * 0.65); },
];

// ---------- scene
const ROAD = 10;             // avenue |x| < 10
const WALK = 5;              // sidewalks 10..15
const FRONT = ROAD + WALK;   // facades at |x| = 15
const Z_NEAR = 90;
const Z_FAR = -230;
const CROSS = [-48, -28];    // cross street (along x)
const ZC = (CROSS[0] + CROSS[1]) / 2;   // crossing centre, the focus plane
const STOREY = 3.2;
const VIADUCT_Z = -132;        // elevated railway across the avenue
const DECK = [7.4, 9.2];
const nearViaduct = (z, m = 6) => Math.abs(z - VIADUCT_Z) < m;

/* Ground: the scramble markings live in one road texture (no coplanar planes). */
{
  const len = Z_NEAR - Z_FAR;
  const W = 512; const H = 8192;
  const kx = W / (2 * ROAD); const kz = H / len;
  const roadMat = tmat('road', W, H, (ctx) => {
    ctx.fillStyle = P.road; ctx.fillRect(0, 0, W, H);
    // metres: x in [-10,10] -> canvas x; z in [Z_FAR, Z_NEAR] -> canvas y (top = far end)
    ctx.setTransform(kx, 0, 0, kz, ROAD * kx, -Z_FAR * kz);
    const r = rng(5);
    for (let i = 0; i < 160; i++) {
      ctx.fillStyle = r() < 0.5 ? P.roadDark : '#454a56';
      ctx.fillRect(-ROAD + r() * 2 * ROAD, Z_FAR + r() * len, 1 + r() * 3, 2 + r() * 6);
    }
    ctx.fillStyle = '#d9d6cf';
    for (const s of [-1, 1]) ctx.fillRect(s * 9.8 - 0.08, Z_FAR, 0.16, len);           // edge lines
    for (let z = Z_NEAR; z > Z_FAR; z -= 9) {                                           // lane lines
      if (z < CROSS[1] + 9 && z > CROSS[0] - 9) continue;
      for (const x of [-3.4, 3.4]) ctx.fillRect(x - 0.07, z - 5, 0.14, 5);
    }
    ctx.fillStyle = '#e6c84a';
    for (const z0 of [[Z_NEAR, CROSS[1] + 8], [CROSS[0] - 8, Z_FAR]]) ctx.fillRect(-0.18, z0[1], 0.12, z0[0] - z0[1]), ctx.fillRect(0.06, z0[1], 0.12, z0[0] - z0[1]);
    ctx.fillStyle = '#e8e5de';
    for (const zc of [CROSS[1] + 3.5, CROSS[0] - 3.5]) {                                 // crosswalks over the avenue
      for (let x = -9.4; x < 9.4; x += 1.0) ctx.fillRect(x, zc - 2.5, 0.5, 5);
    }
    ctx.fillRect(-9.6, CROSS[1] + 7.2, 9.4, 0.35); ctx.fillRect(0.2, CROSS[0] - 7.5, 9.4, 0.35);   // stop lines
    for (const dir of [1, -1]) {                                                         // the scramble diagonals
      ctx.save();
      ctx.translate(0, ZC);
      ctx.rotate(dir * Math.atan2(CROSS[1] - CROSS[0], 2 * ROAD));
      for (let u = -11; u < 11; u += 1.0) ctx.fillRect(u, -2.2, 0.5, 4.4);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(25,28,36,0.22)';                                               // wet patches (subtle: reflections do the work)
    for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.ellipse(-ROAD + r() * 2 * ROAD, Z_FAR + r() * len, 0.5 + r() * 1.5, 1 + r() * 3, 0, 0, 7); ctx.fill(); }
  });
  hquad(world, 2 * ROAD, len, 0, 0, (Z_NEAR + Z_FAR) / 2, roadMat);

  const cw = 90; const cd = CROSS[1] - CROSS[0];
  const crossMat = tmat('crossRoad', 2048, 512, (ctx, w, h) => {
    ctx.fillStyle = P.road; ctx.fillRect(0, 0, w, h);
    const k = w / cw;  // canvas x 0 = the avenue edge; v across the street
    ctx.fillStyle = '#d9d6cf';
    ctx.fillRect(0, 8, w, 4); ctx.fillRect(0, h - 12, w, 4);
    for (let x = 30; x < w; x += 9 * k) ctx.fillRect(x, h / 2 - 3, 5 * k, 6);
    ctx.fillStyle = '#e8e5de';
    for (let v = 0.6; v < cd - 0.6; v += 1.0) ctx.fillRect(1.2 * k, (v / cd) * h, 5 * k, (0.5 / cd) * h);   // crosswalk at the mouth
  });
  /* left arm runs -x: mirror its u so canvas x 0 stays at the avenue edge */
  {
    const leftArm = hquad(world, cw, cd, -(ROAD + cw / 2), 0, ZC, crossMat);
    const uv = leftArm.geometry.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setX(i, 1 - uv.getX(i));    // mirrored: u = 0 at the avenue edge
  }
  hquad(world, cw, cd, ROAD + cw / 2, 0, ZC, crossMat);
  hquad(world, 1600, 2400, 0, -0.3, -100, mat('#262832'));

  const paveMat = tmat('pave', 256, 256, (ctx, w, h) => {
    ctx.fillStyle = P.walk; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    for (let i = 0; i <= 8; i++) { ctx.fillRect(0, i * h / 8, w, 2); ctx.fillRect(i * w / 8, 0, 2, h); }
    ctx.fillStyle = '#c9a53a'; ctx.fillRect(w * 0.12, 0, w * 0.06, h);
  }, { repeat: true });
  const kerbMat = mat(P.kerb);
  const blocks = [
    // [x0, x1, z0, z1, kerbFaces]  sidewalks as quads (corners wrap round the cross street)
    ...[-1, 1].map((s) => [s * ROAD, s * FRONT, Z_NEAR, CROSS[1]]),
    ...[-1, 1].map((s) => [s * ROAD, s * FRONT, CROSS[0], Z_FAR]),
  ];
  for (const [xa, xb, za, zb] of blocks) {
    const x0 = Math.min(xa, xb); const x1 = Math.max(xa, xb); const L = za - zb;
    hquad(world, x1 - x0, L, (x0 + x1) / 2, 0.15, (za + zb) / 2, paveMat, (x1 - x0) / 5, L / 5);
    const kx = Math.abs(xa) === ROAD ? xa : xb;
    vquad(world, L, 0.15, kx, 0.075, (za + zb) / 2, kx < 0 ? Math.PI / 2 : -Math.PI / 2, kerbMat);
    if (za !== Z_NEAR) vquad(world, x1 - x0, 0.15, (x0 + x1) / 2, 0.075, za, 0, kerbMat);
    if (zb !== Z_FAR) vquad(world, x1 - x0, 0.15, (x0 + x1) / 2, 0.075, zb, Math.PI, kerbMat);
  }
  // cross-street sidewalks
  for (const s of [-1, 1]) {

      hquad(world, x1 - x0, za - zb, (x0 + x1) / 2, 0.15, (za + zb) / 2, paveMat, (x1 - x0) / 5, 1);
      vquad(world, x1 - x0, 0.15, (x0 + x1) / 2, 0.075, face === Math.PI ? zb : za, face, kerbMat);

const WALLS = [P.wallA, P.wallB, P.wallC, P.wallD, P.wallE];
const SHOPS = [

  ['居酒屋 灯', '#b0562a'], ['靴の店 アシ', '#b03a6a'], ['24H MART', '#1f9a8a'], ['写真館 ルミ', '#8a6a2a'],
  ['牛丼 まさ', '#d07a1f'], ['ゲーム ネオ', '#c02fa0'],
];
const VSIGNS = [
  ['カラオケ', '#ff4b3a', '#fff6e6'], ['居酒屋', '#ffd23f', '#121320'], ['英会話', '#3fe0ff', '#121320'],
  ['ホテル', '#ff4f9a', '#ffffff'], ['焼肉', '#ff8a2a', '#121320'], ['ネットカフェ', '#53f29a', '#121320'], ['歯科', '#ffffff', '#2f7fd0'],

function roofKit(g, r, xa, xb, za, zb, y) {
  const cx = (xa + xb) / 2; const cz = (za + zb) / 2; const railM = mat(P.metal);
  if (r() < 0.6) {
    const tx = cx + (r() - 0.5) * (xb - xa) * 0.4; const tz = cz + (r() - 0.5) * (za - zb) * 0.4;
    for (const [dx, dz] of [[-0.7, -0.7], [0.7, -0.7], [-0.7, 0.7], [0.7, 0.7]]) box(g, 0.1, 1.2, 0.1, tx + dx, y, tz + dz, railM);
    cyl(g, 1.0, 1.0, 1.6, tx, y + 1.2, tz, mat('#8f939b'), 18);
  }
  if (r() < 0.6) { box(g, 2.6, 2.4, 2.2, xa + 1.8, y, zb + 1.6, mat(P.wallD)); }
  if (r() < 0.7) { cyl(g, 0.03, 0.03, 3.2, xb - 1.2, y, za - 1.2, railM, 6); box(g, 0.12, 0.12, 0.12, xb - 1.2, y + 3.2, za - 1.2, mat(P.neonRed, 1)); } // aircraft light
  const h = 1.0;
  for (const [a, b] of [[[xa, za], [xb, za]], [[xb, za], [xb, zb]], [[xb, zb], [xa, zb]], [[xa, zb], [xa, za]]]) {
    bar(g, [a[0], y + h, a[1]], [b[0], y + h, b[1]], 0.05, railM);
    const n = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 2));
    for (let i = 0; i <= n; i++) { const f = i / n; const px = a[0] + (b[0] - a[0]) * f; const pz = a[1] + (b[1] - a[1]) * f; bar(g, [px, y, pz], [px, y + h, pz], 0.04, railM); }
  }
}

const SCREENS = [];   // { mesh, slides: [materials], cuts }
/** Big ad screen on a facade: frame + screen quad that swaps slides. */
function bigScreen(g, fr, u, y, w, h, seed) {
  const [sx, sz] = fr.at(u, 0.6);
  const frameM = mat(P.dark);
  box(g, w + 0.6, h + 0.6, 0.4, sx, y - 0.3, sz, frameM, fr.a);
  for (const du of [-w / 3, w / 3]) {                                   // brackets back to the wall
    const [ax, az] = fr.at(u + du, 0); const [bx, bz] = fr.at(u + du, 0.45);
    bar(g, [ax, y + h * 0.8, az], [bx, y + h * 0.8, bz], 0.1, mat(P.metal));
  }
  const [qx, qz] = fr.at(u, 0.81);
  const slides = [0, 1, 2, 3].map((k) => (seed + k) % SLIDES.length).map((k) =>
    tmat(`slide-${k}`, 640, 360, SLIDES[k], { glowAll: true }));
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), slides[0]);
  mesh.position.set(qx, y + h / 2, qz); mesh.rotation.y = fr.a;
  live.add(mesh);                                                       // swaps material: kept out of the merge
  SCREENS.push({ mesh, slides, cuts: 8, phase: seed * 0.37 });
}

/**
 * Building box x in [xa,xb], z in [zb,za]; `front` faces the street ('px'|'nx'|'pz'|'nz').
 * opts.screen: put a big screen on face `opts.screen` (usually the one facing the crossing).
 */
function building(xa, xb, za, zb, storeys, front, r, opts = {}) {
  const g = new THREE.Group(); world.add(g);
  const wall = pick(r, WALLS);
  const height = 3.6 + storeys * STOREY;
  const sideM = tmat(`side-${wall}`, 256, 170, paintSideWall(wall), { repeat: true });
  const tileSeed = Math.floor(r() * 4);
  const tile = windowTile(wall, 300 + tileSeed * 11 + WALLS.indexOf(wall));
  const winM = tmat(`win-${wall}-${tileSeed}`, 512, 170, tile.paint, { repeat: true, glowPaint: tile.glow });
  const W = xb - xa; const D = za - zb; const cx = (xa + xb) / 2; const cz = (za + zb) / 2;
  const y0 = -0.3; const hh = height - y0;
  const faces = {
    pz: { w: W, x: cx, z: za, a: 0 }, nz: { w: W, x: cx, z: zb, a: Math.PI },
    px: { w: D, x: xb, z: cz, a: Math.PI / 2 }, nx: { w: D, x: xa, z: cz, a: -Math.PI / 2 },
  };
  for (const [k, f] of Object.entries(faces)) {
    if (k === front) continue;
    /* faces toward the crossing get lit windows too: corner views look at them */
    const m = k === opts.screen ? winM : sideM;
    const ru = k === opts.screen ? f.w / 9.6 : f.w / 9.6 * 1.5;
    vquad(g, f.w, hh, f.x, y0 + hh / 2, f.z, f.a, m, ru, hh / STOREY);
  }
  hquad(g, W, D, cx, height, cz, mat(P.roof));
  const f = faces[front];
  const fr = facade(f.x, f.z, f.a);
  const [name, accent] = SHOPS[shopIx++ % SHOPS.length];
  const shop = shopfront(name, accent, shopIx * 7);
  const shopW = Math.round(Math.min(2048, f.w * 40));
  const shopM = tmat(`shop-${shopIx}`, shopW, 138, shop.paint, { glowPaint: shop.glow });
  vquad(g, f.w, 3.45, f.x, 0.15 + 3.45 / 2, f.z, f.a, shopM);
  vquad(g, f.w, storeys * STOREY, f.x, 3.6 + storeys * STOREY / 2, f.z, f.a, winM, f.w / 9.6, storeys);
  // canopy over the shop, its underside lit
  const [ax, az] = fr.at(0, 0.7);
  box(g, f.w * 0.9, 0.18, 1.4, ax, 3.2, az, mat(P.dark), f.a);
  box(g, f.w * 0.86, 0.04, 1.3, ax, 3.16, az, mat('#ffe7c0', 1), f.a);
  for (let s = 0; s < storeys; s++) {                                   // AC units
    if (r() < 0.5) continue;
    const [px, pz] = fr.at((r() - 0.5) * f.w * 0.8, 0.18);
    box(g, 0.8, 0.6, 0.3, px, 3.6 + s * STOREY + 2.4, pz, mat('#9a9ca4'), f.a);
  }
  // lit vertical signs, stacked: they pile into one wall of light in the flat view
  const nSigns = storeys > 3 ? 1 + Math.floor(r() * 2) : (r() < 0.6 ? 1 : 0);
  for (let k = 0; k < nSigns; k++) {
    const [text, bg, fg] = VSIGNS[vIx++ % VSIGNS.length];
    const sh = Math.min(storeys * STOREY - 1, 4 + r() * 6);
    const sM = tmat(`vs-${text}`, 64, 320, paintVertSign(text, bg, fg), { glowAll: true });
    const u = (k === 0 ? -0.3 : 0.3) * f.w + (r() - 0.5) * 1.5;
    const [sx, sz] = fr.at(u, 0.85);
    box(g, 1.2, sh, 0.3, sx, 4.2, sz, sM, f.a + Math.PI / 2);
    for (const fy of [0.15, 0.85]) {
      const [bx0, bz0] = fr.at(u, 0); const [bx1, bz1] = fr.at(u, 0.25);
      bar(g, [bx0, 4.2 + sh * fy, bz0], [bx1, 4.2 + sh * fy, bz1], 0.05, mat(P.metal));
    }
  }
  if (opts.screen) {
    const sf = faces[opts.screen];
    const sfr = facade(sf.x, sf.z, sf.a);
    const sw = Math.min(sf.w * 0.7, 14); const shh = sw * 9 / 16;
    bigScreen(g, sfr, 0, opts.screenY ?? Math.max(6, height - shh - 3), sw, shh, opts.seed ?? 0);
  }
  // rooftop sign frame on tall buildings
  if (storeys >= 8 && r() < 0.6) {
    const [rx, rz] = fr.at(0, -2);
    const text = pick(r, ['HOSHI', 'KUMO', 'AOI BANK', 'NEO']);
    const rM = tmat(`roof-${text}`, 512, 96, (ctx, w, h) => {
      ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = pick(r, [P.neonCyan, P.neonPink, P.neonYellow]);
      ctx.font = `bold ${h * 0.7}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w / 2, h * 0.55);
    }, { glowPaint: (ctx, w, h) => { ctx.fillStyle = '#fff'; ctx.font = `bold ${h * 0.7}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w / 2, h * 0.55); } });
    const sw = Math.min(f.w * 0.8, 12);
    for (const du of [-sw / 3, sw / 3]) { const [px, pz] = fr.at(du, -2); bar(g, [px, height, pz], [px, height + 1.2, pz], 0.12, mat(P.metal)); }
    vquad(g, sw, sw * 96 / 512, rx, height + 1.2 + sw * 96 / 1024, rz, f.a, rM);
  }
  const [px, pz] = fr.at(0, -0.15);
  box(g, f.w, 0.6, 0.3, px, height, pz, mat(wall), f.a);
  roofKit(g, r, xa + 0.3, xb - 0.3, za - 0.3, zb + 0.3, height);
}

/* Low near the crossing (corner views must clear them), tall toward both ends. */
function storeysAt(z, r) {
  const d = Math.min(Math.abs(z - CROSS[0]), Math.abs(z - CROSS[1]));
  if (d < 40) return 2 + Math.floor(r() * 3);
  return 6 + Math.floor(r() * 9);
}
function buildRow(side, seed) {
  const r = rng(seed);
  for (const [za, zb] of [[70, CROSS[1] + WALK], [CROSS[0] - WALK, VIADUCT_Z + 6], [VIADUCT_Z - 6, Z_FAR + 2]]) {
    let z = za; let first = true;
    while (z - 4 > zb) {
      let len = Math.min(8 + r() * 10, z - zb);
      if (z - len - zb < 6) len = z - zb;
      const gap = r() < 0.25 && len > 9 ? 0.8 : 0;
      const depth = 14 + r() * 6;
      const xa = side < 0 ? -(FRONT + depth) : FRONT;
      const xb = side < 0 ? -FRONT : FRONT + depth;
      const zEnd = z - len + gap;
      const atCross = (zb === CROSS[1] + WALK && zEnd - 0.01 <= zb) || (za === CROSS[0] - WALK && first);
      const screen = atCross ? (za === CROSS[0] - WALK ? 'pz' : 'nz') : undefined;
      building(xa, xb, z, zEnd, storeysAt((z + zEnd) / 2, r), side < 0 ? 'px' : 'nx', r, { screen, seed: Math.floor(r() * 4) });
      z -= len; first = false;
    }
  }
}
buildRow(-1, 31);
buildRow(1, 37);
building(-40, 40, Z_FAR + 2, Z_FAR - 14, 13, 'pz', rng(41), { screen: 'pz', seed: 2, screenY: 9.8 });   // low enough for the flat frame               // closes the avenue
/* cross-street rows (seen in the corner views) */
for (const s of [-1, 1]) {
  const r = rng(50 + s);
  for (let x = FRONT + 2; x < 95; ) {
    const len = 9 + r() * 9;
    const xa = s < 0 ? -(x + len) : x; const xb = s < 0 ? -x : x + len;
    building(xa, xb, CROSS[1] + WALK + 16, CROSS[1] + WALK, 2 + Math.floor(r() * 4), 'nz', r);   // south side faces -z
    building(xa, xb, CROSS[0] - WALK, CROSS[0] - WALK - 16, 2 + Math.floor(r() * 4), 'pz', r);   // north side faces +z
    x += len;
  }
}

            if (N2.a <= 0.0) continue;
            float Y = camY + (uv2.y * 2.0 - 1.0 - shift.y) * tanHV.y * N2.a;
            float mirr = (-Y - camY) / N2.a / tanHV.y + shift.y;
            if (Y > 0.35 && mirr <= ndcG) {
              float g2; refl = shadeAt(uv2, g2);
              hit = (1.0 - smoothstep(0.85, 0.99, uv2.y)) * (g2 > 0.5 ? 1.0 : 0.45);
              break;
            }
          }
          float puddle = smoothstep(0.45, 0.7, fbm(posW.xz * 0.35));
          float wet = 0.32 + 0.45 * puddle;
          col = mix(col, refl, wet * hit);
        }

        /* ink: depth ridge, normals, flat colour — never on glowing faces */
        if (glow < 0.5) {
          float r = mix(1.7, 0.9, smoothstep(12.0, 300.0, D)) * lineScale;
          vec2 o = r / res;
          vec4 L = texture2D(tNrm, vUv - vec2(o.x, 0.0)), R = texture2D(tNrm, vUv + vec2(o.x, 0.0));
          vec4 U = texture2D(tNrm, vUv + vec2(0.0, o.y)), B = texture2D(tNrm, vUv - vec2(0.0, o.y));
          float iz = 1.0 / D;
          float ridge = (2.0 * iz - invD(L) - invD(R)) + (2.0 * iz - invD(U) - invD(B));
          float eD = smoothstep(0.004, 0.012, max(ridge, 0.0) / iz);
          if (L.a <= 0.0 || R.a <= 0.0 || U.a <= 0.0 || B.a <= 0.0) eD = 1.0;
          float nd = max(max(1.0 - dot(nV, L.xyz), 1.0 - dot(nV, R.xyz)), max(1.0 - dot(nV, U.xyz), 1.0 - dot(nV, B.xyz)));
          float eN = smoothstep(0.12, 0.32, nd);
          vec3 aL = texture2D(tAlb, vUv - vec2(o.x, 0.0)).rgb, aR = texture2D(tAlb, vUv + vec2(o.x, 0.0)).rgb;
          vec3 aU = texture2D(tAlb, vUv + vec2(0.0, o.y)).rgb, aB = texture2D(tAlb, vUv - vec2(0.0, o.y)).rgb;
          float ad = max(length(aL - aR), length(aU - aB));
          float mpp = D * 2.0 * tanHV.y / res.y;
          float eA = smoothstep(0.05, 0.14, ad) * (1.0 - smoothstep(0.025, 0.09, mpp));
          col = mix(col, ground ? lineGrey : ink, eA * (ground ? 0.5 : 0.8));
          col = mix(col, ink, max(eD, eN));
        }
        /* low haze toward the far end, by world z (camera distance would crawl in dolly zooms) */
        float haze = smoothstep(-90.0, -210.0, posW.z) * (1.0 - smoothstep(4.0, 40.0, posW.y)) * 0.45;
        col = mix(col, cityGlow * 0.35 + skyHor * 0.4, haze);
      }
      gl_FragColor = vec4(col, glow);
    }`,
});
const postScene = new THREE.Scene(); postScene.add(new THREE.Mesh(quadGeo, postMat));

/* Bloom: glowing pixels only, quarter size, separable 9-tap blur. */
const bloomDown = new THREE.ShaderMaterial({
  uniforms: { t: { value: rtPost.texture }, texel: { value: new THREE.Vector2(1 / WIDTH, 1 / HEIGHT) } },
  vertexShader: fsVert,
  fragmentShader: `uniform sampler2D t; uniform vec2 texel; varying vec2 vUv;
    vec3 s(vec2 o){ vec4 c = texture2D(t, vUv + o * texel); return c.rgb * c.a; }
    void main(){ gl_FragColor = vec4((s(vec2(-1,-1)) + s(vec2(1,-1)) + s(vec2(-1,1)) + s(vec2(1,1))) * 0.25, 1.0); }`,
  depthTest: false, depthWrite: false,
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: null }, dir: { value: new THREE.Vector2() } },
  vertexShader: fsVert,
  fragmentShader: `uniform sampler2D t; uniform vec2 dir; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb * 0.2270;
      c += (texture2D(t, vUv + dir).rgb + texture2D(t, vUv - dir).rgb) * 0.1946;
      c += (texture2D(t, vUv + dir * 2.0).rgb + texture2D(t, vUv - dir * 2.0).rgb) * 0.1216;
      c += (texture2D(t, vUv + dir * 3.0).rgb + texture2D(t, vUv - dir * 3.0).rgb) * 0.0541;
      c += (texture2D(t, vUv + dir * 4.0).rgb + texture2D(t, vUv - dir * 4.0).rgb) * 0.0162;
      gl_FragColor = vec4(c, 1.0); }`,
  depthTest: false, depthWrite: false,
});
const fsScene = new THREE.Scene(); const fsQuad = new THREE.Mesh(quadGeo, bloomDown); fsScene.add(fsQuad);
function fullscreen(material, target) { fsQuad.material = material; renderer.setRenderTarget(target); renderer.render(fsScene, quadCam); }

const accMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: rtPost.texture }, b: { value: rtQ1.texture }, w: { value: 1 }, bloom: { value: 0.9 } },
  vertexShader: fsVert,
  fragmentShader: `uniform sampler2D t, b; uniform float w, bloom; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb + texture2D(b, vUv).rgb * bloom;
      vec2 q = vUv - 0.5; c *= 1.0 - 0.3 * smoothstep(0.35, 0.85, length(q * vec2(1.0, 0.75)) * 1.25);
      gl_FragColor = vec4(c * w, w); }`,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendEquation: THREE.AddEquation, depthTest: false, depthWrite: false,
});
const blitMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: rtAcc.texture } },
  vertexShader: fsVert,
  fragmentShader: `uniform sampler2D t; varying vec2 vUv;
    vec3 toSRGB(vec3 c){ c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    void main(){
      vec3 c = texture2D(t, vUv).rgb;
      c = c / (1.0 + c * 0.35);                                       /* soft roll-off for glow */
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      c = mix(c * vec3(0.9, 0.96, 1.18), c, smoothstep(0.0, 0.5, l));  /* blue shadows */
      c = c * 0.94 + 0.012;                                          /* lifted blacks */
      gl_FragColor = vec4(toSRGB(c), 1.0); }`,
  depthTest: false, depthWrite: false,
});

function drawSample(ms, jx, jy) {
  const shot = TL.at(ms / 1000);
  placeWaiters(shot.lay, shot.cs);
  placeCrowd(ms); placeRain(ms); placeScreens(ms); placeTrain(ms);
  const cam = cameraFromShot(shot, ASPECT, { sceneDepth: 1400 });
  const j = jitterToNdc(jx + jitterPx[0], jy + jitterPx[1], WIDTH, HEIGHT);
  applyCamera(cam, j);
  renderer.autoClear = true; renderer.setClearColor(0x000000, 0);
  setPass('alb'); renderer.setRenderTarget(rtAlb); renderer.render(scene, camera);
  setPass('nrm'); renderer.setRenderTarget(rtNrm); renderer.render(scene, camera);
  setPass('lit'); renderer.setRenderTarget(rtLit); renderer.render(scene, camera);
  setPass('alb');
  const u = postMat.uniforms;
  u.shift.value.set(cam.shiftX + j[0], cam.shiftY + j[1]);
  u.tanHV.value.set(cam.tanH, cam.tanV);
  u.camWorld.value.copy(camera.matrixWorld);
  fullscreen(postMat, rtPost);
  fullscreen(bloomDown, rtQ1);
  blurMat.uniforms.t.value = rtQ1.texture; blurMat.uniforms.dir.value.set(1 / QW, 0); fullscreen(blurMat, rtQ2);
  blurMat.uniforms.t.value = rtQ2.texture; blurMat.uniforms.dir.value.set(0, 1 / QH); fullscreen(blurMat, rtQ1);
}

// ---------- hooks
window.renderMany = (list) => {
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0x000000, 0); renderer.clear();
  for (const [ms, jx, jy] of list) {
    drawSample(ms, jx, jy);
    accMat.uniforms.w.value = 1 / list.length;
    renderer.autoClear = false;
    fullscreen(accMat, rtAcc);
    renderer.autoClear = true;
  }
  fullscreen(blitMat, null);
  return list.length;
};
window.render = (ms) => window.renderMany([[ms, 0, 0]]);
window.setJitter = (x, y) => { jitterPx = [x, y]; };
window.probe = (ms) => {
  const cam = cameraFromShot(TL.at(ms / 1000), ASPECT);
  return PROBES.map((p) => {
    const q = projectPoint(cam, p, WIDTH, HEIGHT);
    if (!q || q.depth < cam.near || Math.abs(q.ndcX) > 1.5 || Math.abs(q.ndcY) > 1.5) return null;
    return { px: q.px, py: q.py };
  });
};
window.shotAt = (ms) => TL.at(ms / 1000);

await document.fonts.ready;
window.render(0);
window.READY = true;
</script>
</body>
