<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vector Maze</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #1a1a1e;
            --accent-color: #00ffcc;
            --danger-color: #ff3b30;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-container {
            width: 100%;
            max-width: 450px;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #stars {
            color: #ffcc00;
            font-size: 22px;
        }

        #game-container {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 450px;
            max-height: 450px;
            background-color: var(--panel-color);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .overlay-stars {
            font-size: 40px;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-retry {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="stats" id="level-display">LEVEL 1</div>
        <div id="stars">★★★</div>
        <div class="stats" id="lives-display">LIVES: ❤️❤️❤️❤️❤️</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="900"></canvas>

        <!-- Win Overlay -->
        <div class="overlay" id="win-screen">
            <h2 id="win-title">LEVEL CLEAR!</h2>
            <div class="overlay-stars" id="win-stars">★★★</div>
            <button class="btn" id="next-btn" onclick="nextLevel()">NEXT LEVEL</button>
        </div>

        <!-- Lose Overlay -->
        <div class="overlay" id="lose-screen">
            <h2 style="color: var(--danger-color);">GAME OVER</h2>
            <p>You ran out of lives.</p>
            <button class="btn btn-retry" onclick="resetLevel()">RETRY LEVEL</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let currentLevel = parseInt(localStorage.getItem('vector_maze_level')) || 1;
let lives = 5;
let lines = [];
let isAnimating = false;
let activeLine = null;

// Design Levels (Deterministic Configurations)
// x1, y1, x2, y2: Normalized coordinates (0 to 100)
// dx, dy: direction of vector/arrow
const levelsData = {
    1: [
        { id: 1, x1: 20, y1: 30, x2: 80, y2: 30, dx: 1, dy: 0 },
        { id: 2, x1: 50, y1: 10, x2: 50, y2: 90, dx: 0, dy: 1 },
        { id: 3, x1: 20, y1: 70, x2: 80, y2: 70, dx: -1, dy: 0 }
    ],
    2: [
        { id: 1, x1: 15, y1: 20, x2: 85, y2: 20, dx: 1, dy: 0 },
        { id: 2, x1: 85, y1: 15, x2: 85, y2: 85, dx: 0, dy: 1 },
        { id: 3, x1: 85, y1: 80, x2: 15, y2: 80, dx: -1, dy: 0 },
        { id: 4, x1: 15, y1: 85, x2: 15, y2: 15, dx: 0, dy: -1 }
    ],
    3: [
        { id: 1, x1: 10, y1: 25, x2: 90, y2: 25, dx: 1, dy: 0 },
        { id: 2, x1: 30, y1: 10, x2: 30, y2: 90, dx: 0, dy: 1 },
        { id: 3, x1: 70, y1: 10, x2: 70, y2: 90, dx: 0, dy: -1 },
        { id: 4, x1: 10, y1: 50, x2: 90, y2: 50, dx: -1, dy: 0 },
        { id: 5, x1: 10, y1: 75, x2: 90, y2: 75, dx: 1, dy: 0 }
    ]
};

// Generate infinite algorithmic levels if player goes beyond designed ones
function getLevelConfig(lvl) {
    if (levelsData[lvl]) return JSON.parse(JSON.stringify(levelsData[lvl]));
    
    // Procedural generation fallback
    const seedLines = [];
    const count = Math.min(4 + Math.floor(lvl / 2), 10);
    for (let i = 0; i < count; i++) {
        const isVert = i % 2 === 0;
        const pos = 15 + (i * (70 / count));
        seedLines.push({
            id: i,
            x1: isVert ? pos : 10,
            y1: isVert ? 10 : pos,
            x2: isVert ? pos : 90,
            y2: isVert ? 90 : pos,
            dx: isVert ? (Math.random() > 0.5 ? 1 : -1) : 0,
            dy: !isVert ? (Math.random() > 0.5 ? 1 : -1) : 0
        });
    }
    return seedLines;
}

function initLevel() {
    lives = 5;
    isAnimating = false;
    activeLine = null;
    
    const config = getLevelConfig(currentLevel);
    lines = config.map(l => ({
        ...l,
        // Convert to absolute canvas coordinates (canvas size is 900x900)
        x1: (l.x1 / 100) * 900,
        y1: (l.y1 / 100) * 900,
        x2: (l.x2 / 100) * 900,
        y2: (l.x2 / 100) * 900, // safety assignment
        // Calculated start positions for the pointer
        px: (l.x1 / 100) * 900,
        py: (l.y1 / 100) * 900,
        startX: (l.x1 / 100) * 900,
        startY: (l.y1 / 100) * 900,
        // Match specific terminal end point based on directions
        endX: (l.dx !== 0) ? (l.dx > 0 ? (l.x2 / 100) * 900 : (l.x1 / 100) * 900) : (l.x1 / 100) * 900,
        status: 'idle', // 'idle', 'shooting', 'failed', 'cleared'
        color: 'rgba(255,255,255,0.2)'
    }));

    // Fix explicit matching endpoints for lines mapping dynamically
    lines.forEach(l => {
        const raw = levelsData[currentLevel] ? levelsData[currentLevel].find(r=>r.id===l.id) : null;
        if(raw) {
            l.x1 = (raw.x1 / 100) * 900; l.y1 = (raw.y1 / 100) * 900;
            l.x2 = (raw.x2 / 100) * 900; l.y2 = (raw.y2 / 100) * 900;
            l.px = l.startX = l.dx > 0 ? l.x1 : (l.dx < 0 ? l.x2 : l.x1);
            l.py = l.startY = l.dy > 0 ? l.y1 : (l.dy < 0 ? l.y2 : l.y1);
            l.endX = l.dx > 0 ? l.x2 : (l.dx < 0 ? l.x1 : l.x2);
            l.endY = l.dy > 0 ? l.y2 : (l.dy < 0 ? l.y1 : l.y2);
        } else {
            l.endY = l.dy > 0 ? l.y2 : l.y1;
        }
    });

    document.getElementById('win-screen').classList.remove('active');
    document.getElementById('lose-screen').classList.remove('active');
    updateUI();
}

function updateUI() {
    document.getElementById('level-display').innerText = `LEVEL ${currentLevel}`;
    document.getElementById('lives-display').innerText = `LIVES: ` + `❤️`.repeat(Math.max(0, lives));
    
    // Dynamic Star Rating Display during gameplay
    let stars = '★★★';
    if (lives <= 2) stars = '★☆☆';
    else if (lives <= 4) stars = '★★☆';
    document.getElementById('stars').innerText = stars;
}

// Check Point-to-Line segment intersection
function checkCollision(px, py, activeId) {
    for (let line of lines) {
        if (line.id === activeId || line.status === 'cleared') continue;

        // Vector Math for Distance from Point to Line Segment
        const A = px - line.x1;
        const B = py - line.y1;
        const C = line.x2 - line.x1;
        const D = line.y2 - line.y1;

        const dot = A * C + B * D;
        const lenSq = C * C + D * D;
        let param = -1;
        if (lenSq !== 0) param = dot / lenSq;

        let xx, yy;
        if (param < 0) {
            xx = line.x1; yy = line.y1;
        } else if (param > 1) {
            xx = line.x2; yy = line.y2;
        } else {
            xx = line.x1 + param * C;
            yy = line.y1 + param * D;
        }

        const dx = px - xx;
        const dy = py - yy;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 20) { // Collision threshold radius
            return true;
        }
    }
    return false;
}

function update() {
    if (isAnimating && activeLine) {
        const speed = 14;
        activeLine.px += activeLine.dx * speed;
        activeLine.py += activeLine.dy * speed;

        // Check Wall or Destination Bounds Completion
        let reachedEnd = false;
        if (activeLine.dx > 0 && activeLine.px >= activeLine.endX) reachedEnd = true;
        if (activeLine.dx < 0 && activeLine.px <= activeLine.endX) reachedEnd = true;
        if (activeLine.dy > 0 && activeLine.py >= activeLine.endY) reachedEnd = true;
        if (activeLine.dy < 0 && activeLine.py <= activeLine.endY) reachedEnd = true;

        if (checkCollision(activeLine.px, activeLine.py, activeLine.id)) {
            // CRASH: Reset state
            activeLine.status = 'failed';
            activeLine.px = activeLine.startX;
            activeLine.py = activeLine.startY;
            lives--;
            updateUI();
            isAnimating = false;
            
            if (lives <= 0) {
                document.getElementById('lose-screen').classList.add('active');
            }
        } else if (reachedEnd) {
            // SUCCESSFUL PASS
            activeLine.status = 'cleared';
            activeLine.px = activeLine.endX;
            activeLine.py = activeLine.endY;
            isAnimating = false;
            checkWinCondition();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Tracks
    lines.forEach(line => {
        ctx.beginPath();
        ctx.moveTo(line.x1, line.y1);
        ctx.lineTo(line.x2, line.y2);
        ctx.lineWidth = 6;
        
        if (line.status === 'cleared') ctx.strokeStyle = '#00ffcc';
        else if (line.status === 'failed') ctx.strokeStyle = '#ff3b30';
        else ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        
        ctx.stroke();

        // Draw Interactive Pointer Nodes
        ctx.beginPath();
        ctx.arc(line.px, line.py, 16, 0, Math.PI * 2);
        if (line.status === 'cleared') ctx.fillStyle = '#00ffcc';
        else if (line.status === 'failed') ctx.fillStyle = '#ff3b30';
        else ctx.fillStyle = '#ffffff';
        ctx.fill();
        
        // Direction Indicator Arrow inside node
        ctx.beginPath();
        ctx.fillStyle = '#1a1a1e';
        const arrowSize = 6;
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let arrow = "➔";
        if (line.dx < 0) arrow = "➔";
        if (line.dy > 0) arrow = "➔";
        
        ctx.save();
        ctx.translate(line.px, line.py);
        let angle = Math.atan2(line.dy, line.dx);
        ctx.rotate(angle);
        ctx.fillText("▶", 0, 0);
        ctx.restore();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function checkWinCondition() {
    if (lines.every(l => l.status === 'cleared')) {
        let stars = '★★★';
        if (lives <= 2) stars = '★☆☆';
        else if (lives <= 4) stars = '★★☆';
        
        document.getElementById('win-stars').innerText = stars;
        document.getElementById('win-screen').classList.add('active');
    }
}

function nextLevel() {
    currentLevel++;
    localStorage.setItem('vector_maze_level', currentLevel);
    initLevel();
}

function resetLevel() {
    initLevel();
}

// Input Handling
canvas.addEventListener('touchstart', handleInput);
canvas.addEventListener('mousedown', handleInput);

function handleInput(e) {
    if (isAnimating || lives <= 0) return;

    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const clickX = ((clientX - rect.left) / rect.width) * 900;
    const clickY = ((clientY - rect.top) / rect.height) * 900;

    // Detect closest active dot clicked
    for (let line of lines) {
        if (line.status === 'cleared') continue;

        const dist = Math.sqrt((clickX - line.px) ** 2 + (clickY - line.py) ** 2);
        if (dist < 45) { // Responsive interaction boundary
            line.status = 'shooting';
            activeLine = line;
            isAnimating = true;
            break;
        }
    }
}

// Start Setup
initLevel();
loop();
</script>
</body>
</html>
