<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vector Maze</title>
<style>
  :root{
    --bg:#1b212b;
    --panel:#222a36;
    --line:#aeb9cf;
    --cleared:#00ffcc;
    --danger:#ff453a;
    --text:#e8edf6;
    --accent:#4f8cff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  header{
    width:100%;max-width:520px;padding:12px 18px 6px;display:flex;
    align-items:center;justify-content:space-between;
  }
  .title{font-size:22px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;}
  .diff{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
        padding:3px 10px;border-radius:20px;background:transparent;color:#9aa6bd;}
  .lives{display:flex;gap:6px;}
  .drop{width:18px;height:24px;display:inline-block;transition:opacity .2s ease;}
  #progress-wrap{
    width:100%;max-width:520px;padding:2px 18px 10px;display:flex;align-items:center;gap:10px;
  }
  #bar{position:relative;flex:1;height:9px;border-radius:6px;background:#333d4d;overflow:hidden;}
  #bar-fill{height:100%;width:0;background:var(--accent);transition:width .3s ease;}
  #bar .goal{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;
             color:#1b212b;z-index:1;line-height:1;}
  #pct{font-size:13px;font-weight:700;color:#9aa6bd;min-width:38px;text-align:right;}
  #stage{
    position:relative;margin:4px auto 0;width:300px;height:300px; /* sized by layoutStage() */
    background:var(--panel);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45);overflow:hidden;
  }
  canvas{width:100%;height:100%;display:block;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(20,25,33,.86);backdrop-filter:blur(3px);z-index:10;
    opacity:0;pointer-events:none;transition:opacity .25s ease;text-align:center;padding:24px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{margin:0 0 6px;font-size:30px;}
  .overlay .stars{font-size:38px;color:#ffcc44;margin:6px 0 14px;letter-spacing:4px;}
  .overlay p{margin:0 0 18px;color:#aab4c8;}
  .btn{
    border:none;border-radius:26px;padding:12px 30px;font-size:17px;font-weight:700;cursor:pointer;
    background:var(--cleared);color:#06231e;box-shadow:0 6px 18px rgba(0,255,204,.3);
  }
  .btn.danger{background:var(--danger);color:#fff;box-shadow:0 6px 18px rgba(255,69,58,.3);}
  .btn:active{transform:scale(.96);}
  footer{padding:10px;color:#5d6b82;font-size:12px;}
  footer a,.linklike{color:#7f93b3;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
  <header>
    <div class="title">Level&nbsp;<span id="level-num">1</span><span class="diff" id="diff"></span></div>
    <div class="lives" id="lives"></div>
  </header>

  <div id="progress-wrap">
    <div id="bar"><div id="bar-fill"></div><span class="goal">★</span></div>
    <div id="pct">0%</div>
  </div>

  <div id="stage">
    <canvas id="c" width="900" height="900"></canvas>

    <div class="overlay" id="win">
      <h2 style="color:var(--cleared)">Level Clear!</h2>
      <div class="stars" id="win-stars">★★★</div>
      <button class="btn" id="next-btn">Next Level</button>
    </div>

    <div class="overlay" id="lose">
      <h2 style="color:var(--danger)">Out of Drops</h2>
      <p>You ran out of lives.</p>
      <button class="btn danger" id="retry-btn">Retry Level</button>
    </div>

    <div class="overlay" id="done">
      <h2 style="color:var(--cleared)">All Levels Cleared!</h2>
      <p>You peeled every maze. Nice work.</p>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <footer><span class="linklike" id="reset-link">Restart level</span></footer>

<script>
/* ============================================================
   Vector Maze — peel-away line puzzle
   See vector-maze-requirements.md for the full spec.
   Levels are produced by tools/generate-levels.mjs (provably solvable).
   ============================================================ */

// Fixed cell size so boards scale to any grid (square or portrait); the canvas
// dimensions follow the grid and the stage is scaled to fit. Must match
// tools/engine-core.mjs.
const CELL = 32;         // px per grid cell (internal)
const PAD = 40;          // board inset in px
const W = 12;            // line thickness
const CLR = 4;           // extra collision clearance
const HIT = 26;          // input pick radius (px, in canvas space)
const SPEED = 30;        // slide speed (px/frame)
const RETURN_MULT = 1.6; // bounce-back is a bit faster
const START_LIVES = 3;

const canvasW = level => PAD*2 + level.cols*CELL;
const canvasH = level => PAD*2 + level.rows*CELL;

const DIRV = { R:[1,0], L:[-1,0], U:[0,-1], D:[0,1] };

// Difficulty display + theming.
const DIFF = {
  easy:      { name:"Easy",       bg:"rgba(46,204,113,.18)", fg:"#43e08a" },
  medium:    { name:"Medium",     bg:"rgba(79,140,255,.18)", fg:"#6ea8ff" },
  hard:      { name:"Hard",       bg:"rgba(255,149,0,.18)",  fg:"#ffb24d" },
  superhard: { name:"Super Hard", bg:"rgba(175,82,222,.20)", fg:"#c87bff" },
  dense:     { name:"Insane",     bg:"rgba(255,69,58,.18)",  fg:"#ff6b61" }
};

// Levels are loaded at boot from the JSON pack (fetch, with the embedded
// <script id="level-data"> as a file:// fallback). Each is normalized so
// the engine can read level.cols / level.rows directly.
let LEVELS = [];
function normalizeLevel(l){
  return { ...l, cols:l.grid.cols, rows:l.grid.rows };
}
async function loadLevels(){
  // Only fetch when served over http(s); file:// blocks it, so go straight
  // to the embedded copy and avoid a noisy (caught) console error.
  if(location.protocol !== "file:"){
    try{
      const res = await fetch("vector-maze-levels.json", { cache:"no-cache" });
      if(res.ok){
        const j = await res.json();
        if(j && Array.isArray(j.levels) && j.levels.length) return j.levels;
      }
    }catch(e){ /* offline / missing — fall back to embedded copy */ }
  }
  return JSON.parse(document.getElementById("level-data").textContent).levels;
}

/* ===================== Geometry / collision ===================== */

// Build pixel vertices for a line given its level (fixed cell size).
function toPx(level, line){
  return line.points.map(([gx,gy]) => ({ x: PAD + gx*CELL, y: PAD + gy*CELL }));
}

// Segments of a line (array of {x0,y0,x1,y1}).
function segsOf(line){
  const s=[]; const p=line.pxBase;
  for(let i=0;i<p.length-1;i++) s.push({x0:p[i].x,y0:p[i].y,x1:p[i+1].x,y1:p[i+1].y});
  return s;
}

function segAABB(s, pad){
  return {
    minx:Math.min(s.x0,s.x1)-pad, maxx:Math.max(s.x0,s.x1)+pad,
    miny:Math.min(s.y0,s.y1)-pad, maxy:Math.max(s.y0,s.y1)+pad
  };
}

// SNAKE MOVEMENT MODEL (see tools/engine-core.mjs — keep in sync).
// A line peels off head-first: the head travels forward in its pointer
// direction while the body follows the line's own path. The body only retraces
// its own footprint, so the only thing that can block removal is the HEAD'S RAY
// — a straight ray from the head endpoint in the pointer direction to the board
// edge. A line is removable iff that ray is clear of every other line.

function headPoint(line){
  return line.head==="start" ? line.pxBase[0] : line.pxBase[line.pxBase.length-1];
}

// Distance from a line's head endpoint to the board edge along its direction.
function reachToEdge(line){
  const E=headPoint(line), dir=line.dir;
  if(dir==="R") return line.cw - E.x;
  if(dir==="L") return E.x;
  if(dir==="D") return line.ch - E.y;
  return E.y; // U
}

// Smallest forward distance from head point E (moving in dir) at which the
// head's inflated box contacts any segment of `others`. Infinity if clear.
function rayHitDist(E, dir, others){
  const pm=W/2+CLR, ps=W/2;
  const m={ minx:E.x-pm, maxx:E.x+pm, miny:E.y-pm, maxy:E.y+pm };
  let best=Infinity;
  for(const o of others){
    for(const ss of segsOf(o)){
      const s=segAABB(ss,ps);
      let t;
      if(dir==="R"){
        if(!(m.miny<=s.maxy && s.miny<=m.maxy)) continue;
        if(s.maxx<=m.minx) continue;
        t=Math.max(0, s.minx-m.maxx);
      } else if(dir==="L"){
        if(!(m.miny<=s.maxy && s.miny<=m.maxy)) continue;
        if(s.minx>=m.maxx) continue;
        t=Math.max(0, m.minx-s.maxx);
      } else if(dir==="D"){
        if(!(m.minx<=s.maxx && s.minx<=m.maxx)) continue;
        if(s.maxy<=m.miny) continue;
        t=Math.max(0, s.miny-m.maxy);
      } else { // U
        if(!(m.minx<=s.maxx && s.minx<=m.maxx)) continue;
        if(s.miny>=m.maxy) continue;
        t=Math.max(0, m.miny-s.maxy);
      }
      if(t<best) best=t;
    }
  }
  return best;
}

// Can `line` be removed given the other present lines? (head-ray clear)
function canRemove(line, others){
  const E=headPoint(line);
  const reach=reachToEdge(line);
  return rayHitDist(E, line.dir, others.filter(o=>o!==line)) >= reach;
}

/* ===================== Solvability verifier ===================== */
// DFS over remaining-line sets; true if every line can be peeled in some order.
function isSolvable(lines){
  const dead=new Set();
  function rec(present){
    if(present.length===0) return true;
    const key=present.map(l=>l.id).sort().join(",");
    if(dead.has(key)) return false;
    for(const l of present){
      if(canRemove(l, present)){
        const next=present.filter(x=>x!==l);
        if(rec(next)) return true;
      }
    }
    dead.add(key);
    return false;
  }
  return rec(lines.slice());
}

/* ===================== Game state ===================== */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let levelIndex = 0;
let level, lines, lives, active=null, animating=false;

function clampLevel(i){ if(isNaN(i)||i<0) return 0; return Math.min(i, LEVELS.length-1); }

function buildLevel(){
  level = LEVELS[levelIndex];
  lives = level.lives ?? START_LIVES;
  const cw = canvasW(level), ch = canvasH(level);
  canvas.width = cw; canvas.height = ch;
  lines = level.lines.map(src=>{
    const l = { id:src.id, head:src.head, dir:src.dir, points:src.points,
                cw, ch, status:"idle", phase:"go", flash:0, anim:null };
    l.pxBase = toPx(level, src);
    // vertices ordered tail -> head (head is always the last point)
    l.ordered = src.head==="end" ? l.pxBase.slice() : l.pxBase.slice().reverse();
    return l;
  });
  if(!isSolvable(lines.slice())){
    console.warn(`Vector Maze: level "${level.name}" failed solvability check!`);
  }
  active=null; animating=false;
  layoutStage();
  hideOverlays();
  updateUI();
}

// Scale the stage so the (possibly portrait) board fits the viewport while
// preserving the grid's aspect ratio.
function layoutStage(){
  const cw = canvas.width, ch = canvas.height;
  const stage = document.getElementById("stage");
  const maxW = Math.min(window.innerWidth*0.94, 520);
  const maxH = window.innerHeight*0.74;
  const scale = Math.min(maxW/cw, maxH/ch);
  stage.style.width  = Math.round(cw*scale) + "px";
  stage.style.height = Math.round(ch*scale) + "px";
}
window.addEventListener("resize", ()=>{ if(level) layoutStage(); });

function present(){ return lines.filter(l=>l.status!=="cleared"); }

/* ===================== Input ===================== */

function pointToSeg(px,py,s){
  const dx=s.x1-s.x0, dy=s.y1-s.y0;
  const len=dx*dx+dy*dy;
  let t = len? ((px-s.x0)*dx+(py-s.y0)*dy)/len : 0;
  t=Math.max(0,Math.min(1,t));
  const cx=s.x0+t*dx, cy=s.y0+t*dy;
  return Math.hypot(px-cx,py-cy);
}

function pickLine(px,py){
  let best=null, bestD=HIT;
  for(const l of present()){
    for(const s of segsOf(l)){
      const d=pointToSeg(px,py,s);
      if(d<bestD){ bestD=d; best=l; }
    }
  }
  return best;
}

function canvasCoords(e){
  const r=canvas.getBoundingClientRect();
  const cx=e.touches? e.touches[0].clientX : e.clientX;
  const cy=e.touches? e.touches[0].clientY : e.clientY;
  return { x:(cx-r.left)/r.width*canvas.width, y:(cy-r.top)/r.height*canvas.height };
}

function onInput(e){
  e.preventDefault();
  if(animating || lives<=0) return;
  const {x,y}=canvasCoords(e);
  const l=pickLine(x,y);
  if(!l) return;
  activate(l);
}
canvas.addEventListener("mousedown", onInput);
canvas.addEventListener("touchstart", onInput, {passive:false});

/* ===================== Snake-slide mechanic ===================== */

function pathLength(pts){
  let s=0; for(let i=0;i<pts.length-1;i++) s+=Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y);
  return s;
}

// Sub-polyline of an arc-length-parametrized polyline between arc lengths [a,b].
function subPolyline(pts, a, b){
  const out=[]; let acc=0;
  for(let i=0;i<pts.length-1;i++){
    const p=pts[i], q=pts[i+1];
    const len=Math.hypot(q.x-p.x, q.y-p.y);
    if(len<1e-9){ continue; }
    const segStart=acc, segEnd=acc+len;
    const lo=Math.max(a,segStart), hi=Math.min(b,segEnd);
    if(hi>lo-1e-6){
      const t0=(lo-segStart)/len, t1=(hi-segStart)/len;
      const A={x:p.x+(q.x-p.x)*t0, y:p.y+(q.y-p.y)*t0};
      const B={x:p.x+(q.x-p.x)*t1, y:p.y+(q.y-p.y)*t1};
      if(out.length===0) out.push(A);
      out.push(B);
    }
    acc=segEnd;
  }
  return out;
}

function activate(line){
  const others=present().filter(l=>l!==line);
  const E=headPoint(line);
  const reach=reachToEdge(line);
  const hit=rayHitDist(E, line.dir, others);
  // Snake slides forward along its own path (tail -> head) then off a straight
  // ray continuing in the pointer direction.
  const L = pathLength(line.ordered);
  const v = DIRV[line.dir];
  const far = reach + L + 80;
  const ext = line.ordered.concat([{ x:E.x + v[0]*far, y:E.y + v[1]*far }]);

  line.anim = { ext, L, lead:0 };
  active=line; animating=true; line.phase="go"; line.flash=0;
  if(hit>=reach){ line.outcome="clear"; line.target = reach + L + 30; } // slide fully off
  else          { line.outcome="block"; line.target = hit; }           // head stops at obstacle
}

function tick(){
  if(animating && active){
    const a=active.anim;
    if(active.phase==="go"){
      a.lead += SPEED;
      if(a.lead>=active.target){
        a.lead=active.target;
        if(active.outcome==="clear"){
          active.status="cleared"; active.anim=null;
          active=null; animating=false;
          afterClear();
        } else {
          active.phase="return"; active.flash=1;
        }
      }
    } else { // bounce back along its own path after a blocked move
      a.lead -= SPEED*RETURN_MULT;
      if(a.lead<=0){
        // Stays red so the player knows this line is currently blocked. The
        // mark is cleared on any successful removal (the board changed, so a
        // blocked line may now be free) — see afterClear().
        a.lead=0; active.flash=0; active.failed=true; active.status="idle"; active.anim=null;
        active=null; animating=false;
        afterBlock();
      }
    }
  }
  draw();
  requestAnimationFrame(tick);
}

function afterClear(){
  // The board changed: lines that were blocked may now be free, so clear the
  // red "blocked" marks and let the player re-evaluate.
  for(const l of lines) l.failed=false;
  updateUI();
  if(present().length===0) win();
}

function afterBlock(){
  lives--;
  updateUI();
  if(lives<=0) lose();
}

/* ===================== Win / lose ===================== */

function starsFor(){
  const lost=(level.lives??START_LIVES)-lives;
  if(lost===0) return 3;
  if(lost===1) return 2;
  return 1;
}

function win(){
  const s=starsFor();
  document.getElementById("win-stars").textContent="★".repeat(s)+"☆".repeat(3-s);
  document.getElementById("win").classList.add("show");
}
function lose(){ document.getElementById("lose").classList.add("show"); }

document.getElementById("next-btn").onclick=()=>{
  if(levelIndex < LEVELS.length-1){
    levelIndex++; localStorage.setItem("vm_level", levelIndex); buildLevel();
  } else {
    document.getElementById("win").classList.remove("show");
    document.getElementById("done").classList.add("show");
  }
};
document.getElementById("retry-btn").onclick=buildLevel;
document.getElementById("reset-link").onclick=buildLevel;
document.getElementById("restart-btn").onclick=()=>{
  levelIndex=0; localStorage.setItem("vm_level",0); buildLevel();
};

function hideOverlays(){
  for(const id of ["win","lose","done"]) document.getElementById(id).classList.remove("show");
}

/* ===================== UI ===================== */

function dropSVG(filled){
  const color=filled? "var(--accent)" : "#3a4658";
  return `<svg class="drop" viewBox="0 0 18 24"><path d="M9 0 C9 0 1 9 1 15 a8 8 0 0 0 16 0 C17 9 9 0 9 0 Z" fill="${color}"/></svg>`;
}

function updateUI(){
  document.getElementById("level-num").textContent = levelIndex+1;
  const d = DIFF[level.difficulty] || { name:"", bg:"transparent", fg:"#9aa6bd" };
  const de = document.getElementById("diff");
  de.textContent = d.name; de.style.background = d.bg; de.style.color = d.fg;

  const maxLives=level.lives??START_LIVES;
  let html="";
  for(let i=0;i<maxLives;i++) html+=dropSVG(i<lives);
  document.getElementById("lives").innerHTML=html;

  const total=lines.length, cleared=lines.filter(l=>l.status==="cleared").length;
  const pct=Math.round(cleared/total*100);
  document.getElementById("bar-fill").style.width=pct+"%";
  document.getElementById("pct").textContent=pct+"%";
}

/* ===================== Rendering ===================== */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGrid();
  for(const line of lines){
    if(line.status==="cleared") continue;
    const color = (line.flash || line.failed) ? getCss("--danger") : getCss("--line");

    // Body points: animating lines slither along their own path + forward ray;
    // idle lines draw at rest. Head = last point; pointer continues in `dir`.
    let pts;
    if(line.anim){
      const a=line.anim;
      pts = subPolyline(a.ext, a.lead, a.lead + a.L);
    } else {
      pts = line.ordered;
    }
    if(pts.length < 1) continue;

    ctx.lineWidth=W; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle=color;
    ctx.beginPath();
    pts.forEach((p,i)=>{ i? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y); });
    ctx.stroke();

    // pointer (cursor-like arrowhead) at the leading head
    const head = pts[pts.length-1];
    drawPointer(head.x, head.y, line.dir, color);
  }
}

function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawGrid(){
  ctx.fillStyle="rgba(255,255,255,0.05)";
  for(let gx=0;gx<=level.cols;gx++){
    for(let gy=0;gy<=level.rows;gy++){
      ctx.beginPath();
      ctx.arc(PAD+gx*CELL, PAD+gy*CELL, 1.6, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawPointer(x,y,dir,color){
  const v=DIRV[dir]; const ang=Math.atan2(v[1],v[0]);
  const size=W*1.7;
  ctx.save();
  ctx.translate(x,y); ctx.rotate(ang);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(size, 0);
  ctx.lineTo(-size*0.5, size*0.78);
  ctx.lineTo(-size*0.5,-size*0.78);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ===================== Boot ===================== */
(async function boot(){
  const raw = await loadLevels();
  LEVELS = raw.map(normalizeLevel);
  levelIndex = clampLevel(parseInt(localStorage.getItem("vm_level")) || 0);
  buildLevel();
  requestAnimationFrame(tick);
})();
</script>
