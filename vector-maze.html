<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vector Maze</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #1a1a1e;
            --accent-color: #00ffcc;
            --danger-color: #ff3b30;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-container {
            width: 100%;
            max-width: 450px;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #stars {
            color: #ffcc00;
            font-size: 22px;
        }

        #game-container {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 450px;
            max-height: 450px;
            background-color: var(--panel-color);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .overlay-stars {
            font-size: 40px;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-retry {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="stats" id="level-display">LEVEL 1</div>
        <div id="stars">★★★</div>
        <div class="stats" id="lives-display">LIVES: ❤️❤️❤️❤️❤️</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="900"></canvas>

        <!-- Win Overlay -->
        <div class="overlay" id="win-screen">
            <h2 id="win-title">LEVEL CLEAR!</h2>
            <div class="overlay-stars" id="win-stars">★★★</div>
            <button class="btn" id="next-btn" onclick="nextLevel()">NEXT LEVEL</button>
        </div>

        <!-- Lose Overlay -->
        <div class="overlay" id="lose-screen">
            <h2 style="color: var(--danger-color);">GAME OVER</h2>
            <p>You ran out of lives.</p>
            <button class="btn btn-retry" onclick="resetLevel()">RETRY LEVEL</button>
        </div>
    </div>


</body>
</html>
